
#Disables certain types. Note that all these configs, like in any other mod, only hide stuff from tabs and disable their recipes
[types]

	[types.wood_type]

		[types.wood_type.deeperdarker]
			bloom = true
			echo = true

		[types.wood_type.ecologics]
			flowering_azalea = true
			azalea = true
			coconut = true
			walnut = true

		[types.wood_type.quark]
			azalea = true
			ancient = true
			blossom = true

		[types.wood_type.cataclysm]
			chorus = true

		[types.wood_type.upgrade_aquatic]
			driftwood = true
			river = true

		[types.wood_type.darkerdepths]
			petrified = true

		[types.wood_type.vinery]
			dark_cherry = true

		[types.wood_type.unusualend]
			chorus_nest = true

		[types.wood_type.eeeabsmobs]
			blighted_oak = true

	[types.leaves_type]

		[types.leaves_type.ecologics]
			coconut = true
			walnut = true

		[types.leaves_type.deeperdarker]
			echo = true

		[types.leaves_type.upgrade_aquatic]
			river = true

		[types.leaves_type.quark]
			ancient = true
			blue_blossom = true
			lavender_blossom = true
			orange_blossom = true
			yellow_blossom = true
			red_blossom = true

		[types.leaves_type.galosphere]
			opal = true

		[types.leaves_type.vinery]
			grapevine = true
			dark_cherry = true
			apple = true

	[types.cake]

		[types.cake.farmersrespite]
			coffee_cake = true

